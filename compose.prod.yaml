# Production override for the VPS. The deploy workflow copies it next to compose.yaml and runs:
#   docker compose -f compose.yaml -f compose.prod.yaml up -d
# The VPS has no source code, so the services use the images from GHCR and do not build.
#
# The database and the certificates live in host folders under /var/lib/toolport, not in Docker
# volumes. No Docker command deletes a host folder, also not `down -v` or `volume prune`.
# create_host_path is false, so a missing folder stops the start. It never starts an empty database.
services:
  postgres:
    restart: unless-stopped
    ports: !reset []
    # Postgres needs time for a clean shutdown. The default 10 s can cut it off.
    stop_grace_period: 1m
    volumes: !override
      - type: bind
        source: /var/lib/toolport/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false

  server:
    build: !reset null
    image: ${TOOLPORT_IMAGE_PREFIX:?set TOOLPORT_IMAGE_PREFIX}/toolport-server:${TOOLPORT_TAG:?set TOOLPORT_TAG}
    restart: unless-stopped

  # Caddy is the only service with public ports. It gets and renews the Let's Encrypt
  # certificate by itself, and keeps it in /var/lib/toolport/caddy between deploys.
  caddy:
    build: !reset null
    image: ${TOOLPORT_IMAGE_PREFIX:?set TOOLPORT_IMAGE_PREFIX}/toolport-caddy:${TOOLPORT_TAG:?set TOOLPORT_TAG}
    restart: unless-stopped
    volumes: !override
      - type: bind
        source: /var/lib/toolport/caddy/data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/toolport/caddy/config
        target: /config
        bind:
          create_host_path: false
