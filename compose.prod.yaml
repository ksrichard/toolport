# Production override for the VPS. The deploy workflow copies it next to compose.yaml and runs:
#   docker compose -f compose.yaml -f compose.prod.yaml up -d
# The VPS has no source code, so the services use the images from GHCR and do not build.
services:
  postgres:
    restart: unless-stopped
    ports: !reset []

  server:
    build: !reset null
    image: ${TOOLPORT_IMAGE_PREFIX:?set TOOLPORT_IMAGE_PREFIX}/toolport-server:${TOOLPORT_TAG:?set TOOLPORT_TAG}
    restart: unless-stopped

  # Caddy is the only service with public ports. It gets and renews the Let's Encrypt
  # certificate by itself. The caddy_data volume keeps the certificate between deploys.
  caddy:
    build: !reset null
    image: ${TOOLPORT_IMAGE_PREFIX:?set TOOLPORT_IMAGE_PREFIX}/toolport-caddy:${TOOLPORT_TAG:?set TOOLPORT_TAG}
    restart: unless-stopped
