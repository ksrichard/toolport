name: toolport

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: toolport
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: toolport
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Only localhost can reach this port. It is for running the backend and tests on the host.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolport -d toolport"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    environment:
      DATABASE_URL: postgres://toolport:${POSTGRES_PASSWORD}@postgres:5432/toolport
      RUST_LOG: ${RUST_LOG:-info}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-10000}
      SPEC_CHECK_INTERVAL_SECS: ${SPEC_CHECK_INTERVAL_SECS:-3600}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      CALL_RETENTION_DAYS: ${CALL_RETENTION_DAYS:-30}
      PUBLIC_URL: https://${TOOLPORT_DOMAIN:-localhost}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SECRETS_KEY: ${SECRETS_KEY:?set SECRETS_KEY in .env}
      ALLOW_LOCAL_UPSTREAM: ${ALLOW_LOCAL_UPSTREAM:-false}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?set GITHUB_CLIENT_ID in .env}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?set GITHUB_CLIENT_SECRET in .env}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"

  caddy:
    build:
      context: .
      dockerfile: docker/caddy.Dockerfile
    environment:
      TOOLPORT_DOMAIN: ${TOOLPORT_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server

volumes:
  pgdata:
  caddy_data:
  caddy_config:
