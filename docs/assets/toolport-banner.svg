<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" role="img" aria-label="ToolPort: turn REST APIs into MCP servers">
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#15391f" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity=".22"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-sm" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation=".6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#040a06" stop-opacity="0"/>
      <stop offset="100%" stop-color="#040a06" stop-opacity=".9"/>
    </radialGradient>
  </defs>

  <rect width="880" height="220" rx="14" fill="#040a06"/>
  <rect width="880" height="220" rx="14" fill="url(#grid)" opacity=".55"/>
  <rect width="880" height="220" rx="14" fill="url(#vignette)"/>

  <!-- The logo from web/src/Brand.tsx, scaled 6x. -->
  <g transform="translate(60 38) scale(6)" stroke-linecap="round">
    <rect x="1" y="3" width="14.5" height="18" rx="4.5" fill="#07120b" stroke="#c9f7d4" stroke-width="1.6"/>
    <path d="M5 7.5c3 0 3 4.5 6 4.5M5 16.5c3 0 3-4.5 6-4.5M5 12h6" fill="none" stroke="#c9f7d4" stroke-width="1.4" opacity=".7"/>
    <g fill="#c9f7d4"><circle cx="5" cy="7.5" r="1.4"/><circle cx="5" cy="12" r="1.4"/><circle cx="5" cy="16.5" r="1.4"/></g>
    <g fill="#39ff7a" stroke="#39ff7a" filter="url(#glow-sm)">
      <path d="M11 12h7.5" stroke-width="1.8"/>
      <rect x="18" y="8" width="3" height="8" rx="1" stroke="none"/>
      <path d="M21 10h2M21 14h2" stroke-width="1.6"/>
      <circle cx="11" cy="12" r="2.3" stroke="none"/>
    </g>
  </g>

  <g font-family="'VT323','JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace">
    <text x="252" y="112" font-size="76" font-weight="700" fill="#39ff7a" filter="url(#glow)" letter-spacing="2">ToolPort</text>
    <text x="256" y="150" font-size="20" fill="#c9f7d4">REST APIs in. MCP tools out.</text>
    <text x="256" y="180" font-size="15" fill="#5f9a6e">$ openapi.json → https://&lt;host&gt;/mcp/&lt;server&gt;<tspan fill="#39ff7a">▌</tspan></text>
  </g>

  <rect width="880" height="220" rx="14" fill="url(#scan)"/>
  <rect x=".75" y=".75" width="878.5" height="218.5" rx="13.5" fill="none" stroke="#15391f" stroke-width="1.5"/>
</svg>
